info:
  name: Update Order statuses
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}driver/update-c2c-order-status"
  headers:
    - name: Content-Type
      value: |
        application/octet-stream
      disabled: true
  body:
    type: multipart-form
    data:
      - name: fe_code
        type: text
        value: CL_PAN
      - name: status
        type: text
        value: DROPBACK_CLW
      - name: delivery_proof
        type: file
        value: []
        disabled: true
      - name: signature
        type: file
        value:
          - postman-cloud:///1ef60843-2793-4ad0-a63c-3b4feb06d8ff
      - name: awb_no
        type: text
        value: CL_C2C_202509241
      - name: failed_delivery_proof
        type: file
        value: []
        disabled: true
      - name: dropback_proof
        type: file
        value:
          - postman-cloud:///1ef60843-2793-4ad0-a63c-3b4feb06d8ff
      - name: reason
        type: text
        value: Customer not available
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

