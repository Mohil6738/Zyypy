info:
  name: Fetch streets
  type: http
  seq: 24

http:
  method: GET
  url: "{{base_url}}streets/1"
  body:
    type: json
    data: get_location/{zone}/{street}/{building}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
